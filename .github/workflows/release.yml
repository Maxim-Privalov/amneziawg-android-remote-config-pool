name: Release (signed APK)
run-name: "Release • ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]          # git tag v3.1.5 && git push origin v3.1.5
  workflow_dispatch:      # ручной прогон: выбери ветку/тег в "Use workflow from"

permissions:
  contents: write         # нужно для создания GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(grep -E '^amneziawgVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          CODE="$(grep -E '^amneziawgVersionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "${TAG#v}" != "${VERSION_NAME}" ]]; then
            echo "::error::Tag '${TAG}' != amneziawgVersionName '${VERSION_NAME}' in gradle.properties"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # build-tools пинним, чтобы apksigner был по известному пути.
          # NDK/CMake AGP докачает сам (версия задана в settings.gradle.kts).
          packages: "platform-tools build-tools;36.0.0"

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          # В RUNNER_TEMP, а не в workspace — чтобы ключ случайно не попал в артефакты
          echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :ui:assembleRelease

      - name: Locate & verify APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}   # опционально, см. инструкцию
        run: |
          set -euo pipefail
          APK="ui/build/outputs/apk/release/AmneziaWG-Remote-Pool-${VERSION_NAME}.apk"
          if [[ ! -f "${APK}" ]]; then
            echo "::error::APK not found: ${APK}"
            ls -la ui/build/outputs/apk/release || true
            exit 1
          fi

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee verify.txt

          # Защита от подписи «не тем» ключом (если задана переменная репозитория)
          CERT_SHA256="$(grep -m1 'certificate SHA-256 digest' verify.txt | awk '{print $NF}')"
          echo "Signer SHA-256: ${CERT_SHA256}"
          if [[ -n "${EXPECTED_SHA256}" && "${CERT_SHA256,,}" != "${EXPECTED_SHA256,,}" ]]; then
            echo "::error::Signer certificate mismatch (expected ${EXPECTED_SHA256})"
            exit 1
          fi

          (cd "$(dirname "${APK}")" && sha256sum "$(basename "${APK}")" > "$(basename "${APK}").sha256")
          echo "file=${APK}" >> "$GITHUB_OUTPUT"
          echo "sha=${APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sha }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.file }}
          SHA: ${{ steps.apk.outputs.sha }}
        run: |
          set -euo pipefail
          FLAGS=(--generate-notes --verify-tag)
          # теги вида v1.2.3-rc1 / -beta → pre-release
          [[ "${TAG}" == *-* ]] && FLAGS+=(--prerelease)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" "${SHA}" --clobber
          else
            gh release create "${TAG}" "${APK}" "${SHA}" --title "${TAG}" "${FLAGS[@]}"
          fi

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/release.jks"
