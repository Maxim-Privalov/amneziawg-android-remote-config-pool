name: Android build (signed release APK)
run-name: "Android • release_apk • ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "master"

jobs:
  build:
    name: "Build (release_apk)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Decode keystore from secret
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 --decode > release.keystore.jks
          echo "KEYSTORE_PATH=${PWD}/release.keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Find unsigned APK
        id: locate
        shell: bash
        run: |
            set -euo pipefail
            APK_DIR="./ui/build/outputs/apk/release"
            UNSIGNED="$(find "${APK_DIR}" -maxdepth 1 -type f -name '*-unsigned.apk' | head -n1)"
            if [[ -z "${UNSIGNED}" ]]; then
            echo "Unsigned APK not found in ${APK_DIR}" >&2
            ls -la "${APK_DIR}" || true
            exit 1
            fi
            echo "unsigned_file=${UNSIGNED}" >> "$GITHUB_OUTPUT"

            - name: Sign APK with apksigner (v1 + v2)
              id: sign
              shell: bash
              env:
                KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
              run: |
                set -euo pipefail
                UNSIGNED="${{ steps.locate.outputs.unsigned_file }}"
                SIGNED="${UNSIGNED%-unsigned.apk}-signed.apk"
                
                BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
                APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
                
                # Ключевой момент: явно включаем и v1, и v2
                "${APKSIGNER}" sign \
                  --ks "${KEYSTORE_PATH}" \
                  --ks-pass "pass:${KEYSTORE_PASSWORD}" \
                  --ks-key-alias "${KEY_ALIAS}" \
                  --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  --out "${SIGNED}" \
                  "${UNSIGNED}"
                
                # Сразу проверяем, что подпись валидна
                "${APKSIGNER}" verify --verbose "${SIGNED}"
                
                echo "final_file=${SIGNED}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.sign.outputs.final_file || steps.locate.outputs.built_file }}
          if-no-files-found: error